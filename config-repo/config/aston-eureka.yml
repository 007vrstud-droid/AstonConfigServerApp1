server:
  port: 8761

spring:
  application:
    name: ASTON-EUREKA
  cloud:
    config:
      uri: http://config-server:8881
  main:
    banner-mode: off

eureka:
  instance:
    hostname: eureka-server
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/